<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASGate - العملاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { box-sizing: border-box; }
        #navbarPlaceholder {
            height: 58px;
            min-height: 58px;
            max-height: 58px;
            flex-shrink: 0;
            width: 100%;
            background: #ffffff;
            display: block;
            box-sizing: border-box;
            border-bottom: 1px solid #e2e8f0;
        }
        .dashboard-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            opacity: 1 !important;
        }
        .table-wrapper { min-height: 200px; }
    </style>
    <link rel="stylesheet" href="./customers.css">
</head>
<body>

<div class="dashboard-container">
    <!-- حاوية موحدة يتم حقن الشريط العلوي فيها تلقائياً بواسطة navbar.js -->
    <div id="navbarPlaceholder"></div>

    <!-- المحتوى الرئيسي للصفحة -->
    <div class="main-content">
        <div class="action-bar">
            <button class="btn-top btn-add" onclick="openAddCustomerModal()">
                <i class="fas fa-plus"></i> إضافة عميل جديد
            </button>
            
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="بحث في الجدول 🔍" onkeyup="debouncedFilterTable()">
            </div>
            
            <div class="stats-bar-visit">
                <div class="stat-total-wrapper">
                    <div class="stat-item">إجمالي العملاء: <span id="stat-total" class="stat-val">0</span></div>
                    <div class="stat-divider">|</div>
                    <div class="stat-item">عملاء الشهر: <span id="stat-month" class="stat-val">0</span></div>
                    <div class="stat-divider">|</div>
                    <div class="stat-item">عملاء اليوم: <span id="stat-today" class="stat-val">0</span></div>
                </div>
            </div>

            <div class="bulk-action-wrapper">
                <button class="btn-bulk-trigger" onclick="toggleDropdown(event, this)">
                    إجراءات جماعية <i class="fas fa-chevron-down" style="font-size:10px;"></i>
                </button>
                <div class="dropdown-menu">
                    <button onclick="handleBulkAction('تغيير المستخدم')"><i class="fas fa-user-edit"></i> تغيير المستخدم</button>
                    <button onclick="handleBulkAction('استيراد')"><i class="fas fa-file-import"></i> استيراد (جديد)</button>
                    <button onclick="handleBulkAction('تصدير')"><i class="fas fa-file-excel"></i> تصدير</button>
                    <button onclick="handleBulkAction('طباعة')"><i class="fas fa-print"></i> طباعة</button>
                    <hr class="dropdown-divider">
                    <button class="del-btn" onclick="handleBulkAction('حذف')"><i class="fas fa-trash-alt"></i> حذف المحدد</button>
                </div>
                <!-- حقل مخفي لرفع ملف الإكسيل -->
                <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleExcelUpload(event)">
            </div>
        </div>
        
        <div class="table-wrapper">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th class="col-select"><input type="checkbox" onclick="toggleAllCheckboxes(this)"></th>
                        <th class="col-code">كود العميل</th>
                        <th class="col-company">اسم الشركة</th>
                        <th class="col-address">المدينة</th> 
                        <th class="col-manager">اسم المسؤول</th>
                        <th class="col-mobile">رقم التواصل</th>
                        <th class="col-email">البريد الإلكتروني</th>
                        <th class="col-main-cr">السجل الرئيسي</th>
                        <th class="col-date">تاريخ الانشاء</th>
                        <th class="col-class">تصنيف العميل</th>
                        <th class="col-notes">الملاحظات</th>
                        <th class="col-status">حالة العميل</th>
                        <th class="col-user">المستخدم</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <!-- سجل النشاط -->
        <div id="activityLogSection" class="activity-log-section">
            <div class="activity-log-header-container">
                <div class="activity-log-title">
                    <i class="fas fa-history"></i> سجل نشاط العملاء
                </div>
                <button id="toggleExpandBtn" class="btn-toggle-expand" onclick="toggleLogExpansion()" title="توسيع / تقليص">
                    <i class="fas fa-expand-alt"></i>
                </button>
            </div>
            <div id="activityList" class="activity-list"></div>
        </div>
    </div>
</div>

<!-- النافذة المنبثقة للملاحظات -->
<div id="noteModal" class="modal-notes" onclick="if(event.target === this) closeNote()">
    <div class="modal-notes-content">
        <div class="modal-header-title">
            <i class="fas fa-sticky-note" style="color:var(--accent-blue)"></i> سجل الملاحظات
        </div>
        <div id="historyLog" class="history-log"></div>
        <textarea id="modalTextArea" class="note-area" placeholder="أدخل تفاصيل الملاحظة هنا..."></textarea>
        <div class="modal-actions">
            <button onclick="closeNote()" class="btn-cancel">إلغاء</button>
            <button onclick="saveNote()" class="btn-save">حفظ الملاحظة</button>
        </div>
    </div>
</div>

<!-- نافذة إضافة عميل جديد -->
<div id="addCustomerModal" class="modal-notes" onclick="if(event.target === this) closeAddCustomerModal()">
    <div class="modal-add-content">
        <div class="modal-add-header">
            <i class="fas fa-user-plus"></i> إضافة عميل جديد
        </div>
        
        <div class="form-grid">
            <div class="modal-input-group">
                <label>كود العميل</label>
                <input type="text" id="addCode" readonly class="modal-input">
            </div>
            <div class="modal-input-group">
                <label>تاريخ الانشاء</label>
                <input type="text" id="addDate" readonly class="modal-input">
            </div>

            <div class="modal-input-group full-width">
                <label>اسم الشركة *</label>
                <input type="text" id="addComp" class="modal-input" placeholder="أدخل اسم الشركة...">
            </div>

            <div class="modal-input-group">
                <label>المدينة</label>
                <input type="text" id="addCity" class="modal-input" placeholder="الرياض، جدة...">
            </div>
            <div class="modal-input-group">
                <label>العنوان</label>
                <input type="text" id="addAddress" class="modal-input" placeholder="الحي، الشارع...">
            </div>

            <div class="modal-input-group">
                <label>رقم السجل الرئيسي</label>
                <input type="text" id="addMainCR" class="modal-input">
            </div>
            <div class="modal-input-group">
                <label>رقم السجل الفرعي</label>
                <input type="text" id="addSubCR" class="modal-input">
            </div>

            <div class="modal-input-group">
                <label>المسؤول</label>
                <input type="text" id="addManager" class="modal-input">
            </div>
            <div class="modal-input-group">
                <label>رقم التواصل</label>
                <input type="text" id="addMob" class="modal-input" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="modal-input-group">
                <label>البريد الالكتروني</label>
                <input type="email" id="addEmail" class="modal-input">
            </div>
            <div class="modal-input-group">
                <label>المستخدم</label>
                <input type="text" id="addCreator" class="modal-input">
            </div>
        </div>

        <div class="modal-actions">
            <button onclick="closeAddCustomerModal()" class="btn-cancel">إلغاء</button>
            <button onclick="saveNewCustomer()" class="btn-save"><i class="fas fa-save"></i> حفظ</button>
        </div>
    </div>
</div>

<script type="module" src="./navbar.js"></script>
<script type="module" src="./customers.js"></script>
</body>
</html>
